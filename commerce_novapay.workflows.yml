novapay_payment:
  id: novapay_payment
  group: commerce_payment
  label: 'NovaPay payment'
  states:
    pending:
      label: 'Pending'
    authorization:
      label: 'Authorization'
    completed:
      label: 'Completed'
    partially_refunded:
      label: 'Partially refunded'
    refunded:
      label: 'Refunded'
    authorization_voided:
      label: 'Authorization (Voided)'
    expired:
      label: 'Expired'
    failed:
      label: 'Failed'
  transitions:
    authorize:
      label: 'Authorize payment'
      from: [pending]
      to: authorization
    authorize_capture:
      label: 'Authorize and capture payment'
      from: [pending]
      to: completed
    capture:
      label: 'Capture payment'
      from: [authorization]
      to: completed
    partially_refund:
      label: 'Partially refund payment'
      from: [completed]
      to: partially_refunded
    refund:
      label: 'Refund payment'
      from: [completed, partially_refunded]
      to: refunded
    void:
      label: 'Void authorization'
      from: [authorization]
      to: authorization_voided
    expire:
      label: 'Expire payment'
      from: [pending]
      to: expired
    fail:
      label: 'Fail payment'
      from: [pending]
      to: failed
    retry:
      label: 'Retry payment'
      from: [failed]
      to: pending
    retry_authorize:
      label: 'Authorize retried payment'
      from: [failed]
      to: authorization
    retry_authorize_capture:
      label: 'Authorize and capture retried payment'
      from: [failed]
      to: completed
